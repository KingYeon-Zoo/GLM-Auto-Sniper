name: 仅 JavaScript 语法检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 仅 JavaScript 语法检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 执行检查
        run: |
          node --check GLM自动抢购.js

      - name: 中止恢复与错误响应回归
        run: node --test tests/retry.test.cjs
